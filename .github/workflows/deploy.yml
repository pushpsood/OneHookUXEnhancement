name: Deploy UX Enhancement (Infra + Backend)

# Two fully isolated stages, deployed in order: gamma, then — after a MANUAL APPROVAL — prod.
#   gamma -> https://chatbot.gamma.onehook.club   (state key terraform.tfstate)
#   prod  -> https://chatbot.onehook.club         (state key prod.terraform.tfstate)
# Each stage's Terraform state + variables live in infra/stages/<stage>.{backend.hcl,tfvars}.
# The Route53 records for both custom domains are owned by the OneHookClient frontend CDK
# (OneHook-ChatbotDns-prod); they must exist before a stage sets custom_domain_enabled = true.
#
# Prod approval: the `approve-prod` job targets the `prod-approval` GitHub environment, which has
# required reviewers. The run pauses there after gamma succeeds until a reviewer approves (or
# rejects) it in the Actions UI. That job never touches Azure; the deploy jobs run the reusable
# deploy-stage.yml with no environment, so the Azure OIDC token subject stays ref:refs/heads/main.

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-stage.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy (all = gamma then prod)'
        type: choice
        options: [all, gamma, prod]
        default: all

concurrency:
  group: deploy-ux-enhancement
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci
      - name: Test and Build TypeScript
        working-directory: ./backend
        run: npm test

  deploy-gamma:
    name: Gamma
    needs: test-backend
    if: (github.event.inputs.stage || 'all') != 'prod'
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: gamma
    secrets: inherit

  approve-prod:
    name: Approve prod
    needs: [test-backend, deploy-gamma]
    # Runs after gamma succeeds, or straight after the tests for a prod-only manual run. Never runs
    # if gamma failed or was cancelled.
    if: >-
      always()
      && needs.test-backend.result == 'success'
      && (github.event.inputs.stage || 'all') != 'gamma'
      && (needs.deploy-gamma.result == 'success' || needs.deploy-gamma.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: prod-approval
      url: https://chatbot.onehook.club
    steps:
      - name: Approved
        run: echo "Prod deploy of ${GITHUB_SHA} approved by ${{ github.actor }} after gamma passed."

  deploy-prod:
    name: Prod
    needs: approve-prod
    if: always() && needs.approve-prod.result == 'success'
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: prod
    secrets: inherit

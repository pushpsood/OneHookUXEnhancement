name: Deploy UX Enhancement (Infra + Backend)

# Two fully isolated stages, deployed in order: gamma, then prod.
#   gamma -> https://chatbot.gamma.onehook.club   (state key terraform.tfstate)
#   prod  -> https://chatbot.onehook.club         (state key prod.terraform.tfstate)
# Each stage's Terraform state + variables live in infra/stages/<stage>.{backend.hcl,tfvars}.
# The Route53 records for both custom domains are owned by the OneHookClient frontend CDK
# (OneHook-ChatbotDns-prod); they must exist before a stage sets custom_domain_enabled = true.

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy (all = gamma then prod)'
        type: choice
        options: [all, gamma, prod]
        default: all

concurrency:
  group: deploy-ux-enhancement
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci
      - name: Test and Build TypeScript
        working-directory: ./backend
        run: npm test

  deploy:
    name: Deploy ${{ matrix.stage }}
    needs: test-backend
    runs-on: ubuntu-latest
    strategy:
      # Sequential: prod only deploys after gamma succeeds.
      max-parallel: 1
      fail-fast: true
      matrix:
        stage: [gamma, prod]
    # No GitHub `environment:` here: the Azure OIDC federated credential trusts the subject
    # `ref:refs/heads/main`, and an environment would change the token subject and break login.
    steps:
      - name: Skip stages not selected
        id: gate
        run: |
          selected="${{ github.event.inputs.stage || 'all' }}"
          if [ "$selected" = "all" ] || [ "$selected" = "${{ matrix.stage }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Setup Terraform
        if: steps.gate.outputs.run == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x
          terraform_wrapper: false

      - name: Azure Login
        if: steps.gate.outputs.run == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        if: steps.gate.outputs.run == 'true'
        working-directory: ./infra
        run: terraform init -input=false -backend-config=stages/${{ matrix.stage }}.backend.hcl

      - name: Terraform Plan
        if: steps.gate.outputs.run == 'true'
        working-directory: ./infra
        run: terraform plan -input=false -var-file=stages/${{ matrix.stage }}.tfvars -out=tfplan

      - name: Terraform Apply
        if: steps.gate.outputs.run == 'true'
        working-directory: ./infra
        run: terraform apply -input=false tfplan

      - name: Export Terraform Outputs
        if: steps.gate.outputs.run == 'true'
        id: tf
        working-directory: ./infra
        run: |
          echo "app_name=$(terraform output -raw app_service_name)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw chatbot_url)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Build Production Package
        if: steps.gate.outputs.run == 'true'
        working-directory: ./backend
        run: |
          npm ci
          npm run build
          rm -rf dist/__tests__
          npm prune --omit=dev

      - name: Deploy to App Service
        if: steps.gate.outputs.run == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.tf.outputs.app_name }}
          package: ./backend
          startup-command: 'npm start'

      - name: Smoke Test (custom domain /health)
        if: steps.gate.outputs.run == 'true'
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.tf.outputs.url }}/health" || true)
            [ "$code" = "200" ] && { echo "healthy: ${{ steps.tf.outputs.url }}"; exit 0; }
            echo "attempt $i: HTTP $code"; sleep 15
          done
          echo "::error::${{ steps.tf.outputs.url }}/health did not return 200"; exit 1
